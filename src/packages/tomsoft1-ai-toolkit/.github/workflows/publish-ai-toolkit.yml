name: Publish AI toolkit to GitHub Packages
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mulatom1'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: |
          npm test
          npm pack --dry-run
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
