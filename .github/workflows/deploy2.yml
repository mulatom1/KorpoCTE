name: Deploy to Azure IIS via FTPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag lub SHA do wdrozenia"
        required: true
        default: main
        type: string
      self_contained:
        description: "Publish self-contained win-x64"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-azure-iis
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test and upload to FTPS staging
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTPS_CA_PEM: ${{ secrets.FTPS_CA_PEM }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record deployed commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/app01/package-lock.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Run backend tests
        env:
          ASPNETCORE_ENVIRONMENT: Test
          DOTNET_ENVIRONMENT: Test
        run: dotnet test APPS.sln --no-restore --verbosity normal

      - name: Write Vite CI environment
        shell: bash
        env:
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
        run: |
          if [[ -z "$VITE_API_URL" || -z "$VITE_APP_TOKEN" ]]; then
            echo "::error::Set production VITE_API_URL and VITE_APP_TOKEN"
            exit 1
          fi
          {
            echo 'VITE_BASE_URL=/tomsoft1/'
            echo "VITE_API_URL=$VITE_API_URL"
            echo "VITE_APP_TOKEN=$VITE_APP_TOKEN"
          } > src/client/app01/.env.ci

      - name: Build frontend
        working-directory: src/client/app01
        run: |
          npm ci
          npx tsc -b
          npx vite build --mode ci

      - name: Publish ASP.NET Core (framework-dependent)
        if: ${{ !inputs.self_contained }}
        run: >-
          dotnet publish src/server/App01/App01.Bootstrapper.Api
          -c Release --no-restore -o publish

      - name: Publish ASP.NET Core (self-contained)
        if: ${{ inputs.self_contained }}
        run: >-
          dotnet publish src/server/App01/App01.Bootstrapper.Api
          -c Release -r win-x64 --self-contained true -o publish

      - name: Assemble package
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p publish/wwwroot
          cp -r src/client/app01/dist/. publish/wwwroot/
          printf '%s' "$DEPLOY_SHA" > publish/wwwroot/version.txt
          rm -f publish/appsettings*.json
          test -f publish/web.config || {
            echo '::error::No web.config in published files'
            exit 1
          }

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-tomsoft1-${{ steps.revision.outputs.sha }}
          path: publish/
          retention-days: 30
          if-no-files-found: error

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare trusted FTPS certificate
        shell: bash
        run: |
          if [[ -z "$FTPS_CA_PEM" ]]; then
            echo '::error::Missing FTPS_CA_PEM repository secret'
            exit 1
          fi
          printf '%s\n' "$FTPS_CA_PEM" > "$RUNNER_TEMP/ftps-ca.pem"
          chmod 600 "$RUNNER_TEMP/ftps-ca.pem"
          openssl x509 -in "$RUNNER_TEMP/ftps-ca.pem" -noout >/dev/null

      - name: Remove previous READY marker
        shell: bash
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<LFTP
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set ssl:ca-file $RUNNER_TEMP/ftps-ca.pem
          set cmd:fail-exit yes
          set net:max-retries 3
          rm -f /READY
          bye
          LFTP

      - name: Upload release to FTPS staging
        shell: bash
        run: |
          # FTP root must point exclusively to C:\deploy\staging\tomsoft1.
          # Do NOT point FTP at the live IIS application directory.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<LFTP
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set ssl:ca-file $RUNNER_TEMP/ftps-ca.pem
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit yes
          mirror -R --delete --verbose publish/ /
          bye
          LFTP

      - name: Mark upload complete
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          printf '%s' "$DEPLOY_SHA" > "$RUNNER_TEMP/READY"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<LFTP
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set ssl:ca-file $RUNNER_TEMP/ftps-ca.pem
          set cmd:fail-exit yes
          put $RUNNER_TEMP/READY -o /READY
          bye
          LFTP

      - name: Summary
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          echo "Uploaded $DEPLOY_SHA to FTPS staging." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does NOT activate the release in IIS; a Windows deployment task must consume READY." >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not activate IIS. Configure a local deployment task on the VM to process READY.' >> "$GITHUB_STEP_SUMMARY"
